name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - feat/fastmcp

# The workflow only reads the repository. Declaring this explicitly keeps the
# job token from inheriting broader write scopes by default.
permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

  mcp:
    name: MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      - name: Verify base install excludes MCP
        run: |
          uv sync --frozen
          uv run --no-sync python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('fastmcp', 'jsonschema'))"
      - run: uv sync --frozen --extra mcp
      - run: uv run --extra mcp ruff check pm_cli_mcp tests
      - run: uv run --extra mcp ruff format --check pm_cli_mcp tests
      - run: uv run --extra mcp pytest -q
