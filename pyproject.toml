[project]
name = "pm-cli-mcp"
version = "0.1.0"
description = "FastMCP server for the Proton Mail CLI"
requires-python = ">=3.13"
dependencies = ["fastmcp==4.0.10", "jsonschema>=4.26"]

[project.scripts]
pm-cli-mcp = "pm_cli_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.15"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
